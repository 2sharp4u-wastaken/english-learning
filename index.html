<!DOCTYPE html>
<html lang="he" dir="rtl" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The app is authored in Hebrew; disable Chrome/Google auto-translate so it
         never mangles the English vocabulary words & letter tiles into Hebrew
         gibberish (e.g. the spell-tiles "i" → "אֲנִי"). -->
    <meta name="google" content="notranslate">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>English Learning Games - לומדים אנגלית בכיף</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- PWA (Slice INFRA1): installable + offline. Manifest + icons + theme color;
         the service worker is registered from src/main.tsx (production only). -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#07101d">
    <link rel="apple-touch-icon" href="/img/pwa/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Slice 4.5: legacy styles.css + game-completion-styles.css deleted (React
         owns all styling via src/styles/*); font-awesome + Poppins CDNs removed
         (React uses Lucide icons + Heebo/Fredoka fonts). -->
    <!-- canvas-confetti self-hosted (INFRA1) so the PWA works fully offline — no
         jsdelivr CDN dependency. Copied into dist/ by the vite copy plugin. -->
    <script src="/vendor/confetti.browser.min.js"></script>
</head>
<body>
    <!-- Slice 4.5: legacy `.app-layout` hub/profile/topics DOM + certificate/exit/toast
         modals deleted (all React-owned, were permanently hidden). -->


    <!-- Error Tracker - Load first to catch all errors -->
    <script src="error-tracker.js"></script>

    <!-- Console Logger - Captures all console output for debugging -->
    <script type="module" src="utils/consoleLogger.js?t=1768159313"></script>

    <!-- auth.js retired in Slice 4.4.b2 — React owns auth (src/bridge/auth.ts). -->
    <script type="module" src="data/_loader.js?t=1773784000"></script>
    <script src="speechSynthesis.js?t=1742300000"></script>
    <script src="feedback.js"></script>
    <script src="audio-effects.js"></script>
    <!-- gamification.js removed 2026-07-12: its only global (window.gamificationManager)
         was referenced nowhere in the React app — orphaned dead code that still
         built DOM via innerHTML from parent-authored word content (attack surface). -->

    <!-- Slice 4.2/4.3: legacy top-header + settings.js retired. React owns the
         header (TopNav / GameHeader) and the settings/stats UI. case/nikud init
         is covered by React textPrefs + data/_loader.js→nikud.js. -->
    <!-- Slice 4.4.b1: the legacy engine boot (gameLogic.js GameManager + app.js
         AppManager) is retired. React now owns startup via src/engine/boot.ts
         (useEngineBoot), which builds the src/engine/* instances once data + auth
         are ready and republishes the same window.* globals the bridges read. -->


    <script>
        // Post-login welcome chime. React Router owns routing (index + catch-all
        // both redirect to /home) and React owns the home screen, so the legacy
        // welcome-screen handler was retired in Slice 4.1.
        window.addEventListener('user-logged-in', (e) => {
            if (!window.audioEffects) return;
            const userId = (e.detail && e.detail.userId) || localStorage.getItem('currentUser');
            let chimeType = 'arpeggio';
            if (userId) {
                try {
                    const progress = JSON.parse(localStorage.getItem(`userProgress_${userId}`) || '{}');
                    chimeType = progress.welcomeChime || 'arpeggio';
                } catch (err) { /* ignore */ }
            }
            setTimeout(() => window.audioEffects.playWelcomeChime(chimeType), 400);
        });
    </script>

    <!-- Slice 4.5: the chime-selector inline script was deleted with the legacy
         `#chime-selector` profile DOM it drove. The welcome chime still plays via
         the `user-logged-in` handler above (reads `progress.welcomeChime`); the
         picker UI for changing it now lives in React if/when re-added. -->

    <!-- React app mount point -->
    <div id="react-root"></div>
    <script type="module" src="/src/main.tsx"></script>

</body>
</html>
