<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Speech Synthesis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background: #1976D2;
        }
        #status {
            margin: 20px 0;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
        }
        .success { color: #4CAF50; }
        .error { color: #f44336; }
    </style>
</head>
<body>
    <h1>🔊 Speech Synthesis Test</h1>

    <div id="status">
        <p>Checking speech synthesis...</p>
    </div>

    <button onclick="testSpeech()">Test "Hello"</button>
    <button onclick="testWord()">Test "Dog"</button>
    <button onclick="checkVoices()">List Voices</button>

    <div id="voices"></div>

    <script src="speechSynthesis.js"></script>

    <script>
        // Check if speechManager loaded
        window.addEventListener('DOMContentLoaded', () => {
            const status = document.getElementById('status');

            if (typeof speechManager === 'undefined') {
                status.innerHTML = '<p class="error">❌ speechManager not loaded!</p>';
                return;
            }

            if (!speechManager.isSpeechSynthesisSupported()) {
                status.innerHTML = '<p class="error">❌ Speech synthesis not supported in this browser</p>';
                return;
            }

            status.innerHTML = `
                <p class="success">✅ speechManager loaded</p>
                <p class="success">✅ Speech synthesis supported</p>
                <p>Voices loading: ${speechManager.voices.length} voices available</p>
            `;

            // Wait for voices to load
            setTimeout(() => {
                status.innerHTML += `<p>Updated: ${speechManager.voices.length} voices now available</p>`;
                if (speechManager.englishVoice) {
                    status.innerHTML += `<p class="success">✅ English voice: ${speechManager.englishVoice.name}</p>`;
                } else {
                    status.innerHTML += `<p class="error">⚠️ No English voice selected</p>`;
                }
            }, 1000);
        });

        async function testSpeech() {
            try {
                const utterance = new SpeechSynthesisUtterance('Hello');
                utterance.lang = 'en-US';
                utterance.rate = 0.9;

                window.speechSynthesis.speak(utterance);

                document.getElementById('status').innerHTML += '<p class="success">🔊 Speaking "Hello" (raw API)</p>';
            } catch (error) {
                document.getElementById('status').innerHTML += `<p class="error">❌ Error: ${error.message}</p>`;
            }
        }

        async function testWord() {
            try {
                await speechManager.speakWord('dog', '', 'vocabulary');
                document.getElementById('status').innerHTML += '<p class="success">🔊 Speaking "dog" (via speechManager)</p>';
            } catch (error) {
                document.getElementById('status').innerHTML += `<p class="error">❌ Error: ${error.message}</p>`;
            }
        }

        function checkVoices() {
            const voicesDiv = document.getElementById('voices');
            const voices = speechManager.voices;

            voicesDiv.innerHTML = '<h3>Available Voices (' + voices.length + '):</h3>';

            const englishVoices = voices.filter(v => v.lang.startsWith('en'));
            voicesDiv.innerHTML += '<h4>English Voices:</h4><ul>';
            englishVoices.forEach(v => {
                voicesDiv.innerHTML += `<li>${v.name} (${v.lang}) ${v.default ? '⭐' : ''}</li>`;
            });
            voicesDiv.innerHTML += '</ul>';

            if (speechManager.englishVoice) {
                voicesDiv.innerHTML += `<p class="success">Selected: ${speechManager.englishVoice.name}</p>`;
            } else {
                voicesDiv.innerHTML += `<p class="error">No English voice selected!</p>`;
            }
        }
    </script>
</body>
</html>
