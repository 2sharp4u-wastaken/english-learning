# Netlify config — Slice INFRA1 host hookup.
#
# The app is a fully static, Python-free SPA: `npm run build` emits `dist/` (the
# Vite bundle + the runtime-served assets the copy plugin adds: legacy scripts,
# data/*.json, img/, sw.js, vendor/confetti). Netlify serves that over HTTPS for
# free — which is what makes the mic games (secure context) and the PWA install
# work on a real device.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 6 needs Node 18+; pin a current LTS for reproducible builds.
  NODE_VERSION = "20"

# ── SPA fallback ─────────────────────────────────────────────────────────────
# Routing is hash-based (/#/home), so the server path is almost always "/". This
# catch-all is a safety net for any non-hash path. Netlify serves real static
# files first (so /assets/*, /img/*, /data/*.json, /sw.js are NOT shadowed) and
# only falls through to index.html for paths that map to no file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Caching headers ──────────────────────────────────────────────────────────
# Content-hashed build output is immutable — cache it hard for fast repeat loads.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must always be revalidated, or browsers won't pick up a new
# deploy's SW (this is exactly the stale-chunk trap — see sw.js / the preloadError
# reload in src/main.tsx). Never long-cache sw.js.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# index.html drives which chunk hashes the app loads — keep it fresh so a new
# deploy is picked up immediately (the SW also fetches it network-first).
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
